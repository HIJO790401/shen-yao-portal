task_id: TASK-20260827-INTRO-VIDEO-INTEGRATION-V1
must_have:
  - the exact owner-provided MP4 is preserved under a safe public ASCII filename
  - the intro uses the local owner video by default without depending on an untracked env file
  - a valid NEXT_PUBLIC_INTRO_VIDEO_URL may still override the local default
  - the video autoplays muted and loops for ordinary motion settings
  - native controls allow a visitor to play pause and enable audio
  - reduced-motion visitors are not forced into autoplay or looping
  - the explicit enter-site action remains available before during and after playback
  - video completion or playback error never enters the site automatically
  - playback failure returns to the approved water poster
  - the full 16:9 composition remains visible on portrait mobile without stretching
  - Chinese and English intro labels remain separate
must_not_have:
  - generated replacement video
  - duplicated visual brand overlay covering the supplied video
  - secret URL credentials or tracking parameters
  - Sites deployment domain DNS or paid-service changes
