original_owner_words: |
  我反对的不是算力，我反对的是把算力当成确定性工具的做法。算力只是让你把一件事情做得更快，但它并不代表可以把一件事情做成有效的判断路径。 而我這套系統做的就是把我判斷的路徑定義清楚，讓算力去依據我這個路徑去做。這就像我在做一台計算機一樣，計算機可以做到一加一等於二，但計算機沒有辦法做到什麼時候我要應用這個計算機。我在決定的事情是，我把計算機放在可以應用的位置。
